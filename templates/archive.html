{% extends "base.html" %}
{% set active_page = "archive" %}
{% block title %}Archive — Progress{% endblock %}
{% block content %}
<div class="mb-6"><h1 class="text-2xl font-bold">Archive</h1></div>
{% if not projects %}<div class="text-center py-16"><p class="text-gray-500">No archived projects</p></div>{% endif %}
{% for pd in projects %}
<div class="bg-gray-900 rounded-xl p-4 mb-3 opacity-70">
    <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full" style="background-color: {{ pd.project.color }}"></div><h3 class="font-medium text-gray-300">{{ pd.project.name }}</h3></div>
        <div class="flex items-center gap-3"><span class="text-sm font-mono text-gray-500">{{ pd.progress }}%</span><button onclick="unarchive({{ pd.project.id }})" class="text-xs text-indigo-400 hover:text-indigo-300">Restore</button></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width: {{ pd.progress }}%; background-color: {{ pd.project.color }}"></div></div>
</div>
{% endfor %}
<script>async function unarchive(id){await api(`/api/projects/${id}`,'PUT',{is_archived:false});location.reload();}</script>
{% endblock %}

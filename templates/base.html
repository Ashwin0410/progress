<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <title>{% block title %}Progress{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">
    <nav class="sticky top-0 z-50 bg-gray-950 bg-opacity-80 backdrop-blur border-b border-gray-800">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="w-7 h-7 rounded-lg bg-indigo-500 flex items-center justify-center text-sm">P</span>
                Progress
            </a>
            <div class="flex items-center gap-1">
                <a href="/search" class="nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></a>
                <a href="/stats" class="nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></a>
                <div class="relative">
                    <button onclick="document.getElementById('user-menu').classList.toggle('hidden')" class="nav-link">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </button>
                    <div id="user-menu" class="hidden absolute right-0 top-full mt-1 bg-gray-900 border border-gray-700 rounded-xl shadow-xl py-1 w-48 z-50">
                        {% if user %}<div class="px-3 py-2 border-b border-gray-800"><p class="text-sm font-medium text-white truncate">{{ user.display_name }}</p><p class="text-xs text-gray-500 truncate">{{ user.email }}</p></div>{% endif %}
                        <a href="/api/export" class="block px-3 py-2 text-sm text-gray-300 hover:bg-gray-800">Export Data</a>
                        <a href="/logout" class="block px-3 py-2 text-sm text-red-400 hover:bg-gray-800">Log Out</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-2xl mx-auto px-4 py-6 pb-24">{% block content %}{% endblock %}</main>
    <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 safe-bottom md:hidden z-50">
        <div class="flex justify-around py-2">
            <a href="/" class="bottom-nav-item {% if active_page == 'dashboard' %}active{% endif %}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span class="text-xs mt-1">Home</span></a>
            <a href="/today" class="bottom-nav-item {% if active_page == 'today' %}active{% endif %}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="text-xs mt-1">Today</span></a>
            <a href="/stats" class="bottom-nav-item {% if active_page == 'stats' %}active{% endif %}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg><span class="text-xs mt-1">Stats</span></a>
            <a href="/archive" class="bottom-nav-item {% if active_page == 'archive' %}active{% endif %}"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg><span class="text-xs mt-1">Archive</span></a>
        </div>
    </nav>
    <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-end md:items-center justify-center" onclick="closeModal(event)">
        <div id="modal-content" class="bg-gray-900 rounded-t-2xl md:rounded-2xl w-full max-w-lg p-6 modal-sheet" onclick="event.stopPropagation()"></div>
    </div>
    <div id="toast" class="fixed top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-xl shadow-lg transform translate-x-full transition-transform z-50 text-sm"></div>
    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(console.error);
        document.addEventListener('click', e => { const m = document.getElementById('user-menu'); if (m && !e.target.closest('.relative')) m.classList.add('hidden'); });
    </script>
</body>
</html>

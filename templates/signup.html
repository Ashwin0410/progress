<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#6366f1">
    <title>Sign Up — Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'DM Sans', sans-serif; } .input-field { width:100%; background:#1f2937; border:1px solid #374151; border-radius:0.75rem; padding:0.75rem 1rem; color:white; font-size:0.9375rem; outline:none; } .input-field:focus { border-color:#6366f1; } .btn-primary { width:100%; padding:0.75rem; background:#6366f1; color:white; font-weight:600; border-radius:0.75rem; border:none; cursor:pointer; } .btn-primary:hover { background:#4f46e5; }</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-indigo-500 flex items-center justify-center"><span class="text-2xl font-bold text-white">P</span></div>
            <h1 class="text-2xl font-bold">Create your account</h1>
            <p class="text-sm text-gray-400 mt-1">Start tracking your progress</p>
        </div>
        {% if error %}<div class="bg-red-900 bg-opacity-30 border border-red-800 text-red-300 text-sm rounded-xl px-4 py-3 mb-4">{{ error }}</div>{% endif %}
        <form method="POST" action="/signup">
            <div class="mb-4"><label class="block text-sm text-gray-400 mb-1.5">Name</label><input type="text" name="name" class="input-field" placeholder="Your name (optional)"></div>
            <div class="mb-4"><label class="block text-sm text-gray-400 mb-1.5">Email</label><input type="email" name="email" class="input-field" placeholder="you@example.com" required></div>
            <div class="mb-6"><label class="block text-sm text-gray-400 mb-1.5">Password</label><input type="password" name="password" class="input-field" placeholder="At least 6 characters" required minlength="6"></div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="/login" class="text-indigo-400 hover:text-indigo-300">Log in</a></p>
    </div>
</body>
</html>
